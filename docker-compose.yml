# Alternativa si no tienes PostgreSQL instalado: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestion_diaria
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data
volumes:
  datos:
